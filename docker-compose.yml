services:
  db:
    image: postgres:16-alpine
    container_name: agat-hotel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agat
      POSTGRES_PASSWORD: agat
      POSTGRES_DB: agat
    ports:
      - "5432:5432"
    volumes:
      - agat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agat -d agat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agat_pg_data:
